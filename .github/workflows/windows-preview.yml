name: Windows Connector Preview
on:
  push:
    branches: [test/windows-connector-validation, feature/arabic-manga-hub]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned repository dependencies
        run: npm install
      - name: Isolated Windows path, recovery and 500-task diagnostics
        id: diagnostics
        run: node test/windows-ci-diagnostics.mjs
      - name: Upload sanitized Windows diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-CI-diagnostics-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: app/electron/bundle/windows-ci-diagnostics.json
      - name: Unit tests
        run: npm test
      - name: Static validation
        run: npm run check
      - name: Build main-process preload for Windows integration checks
        run: npm run build --workspace=app/electron
      - name: Native SQLite recovery and process interruption checks
        run: node test/archive-runtime.mjs
      - name: Windows Electron hub and selective-queue integration
        id: integration
        env:
          HARUNEKO_PRIORITY_CONNECTORS: '1'
        run: node test/windows-electron-integration.mjs
      - name: Upload sanitized Windows integration checkpoint
        if: always() && steps.integration.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Electron-integration-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/electron/bundle/windows-electron-integration.json
            app/electron/bundle/windows-electron-integration.log
      - name: Build isolated portable Preview with bundled web UI
        run: node app/electron/scripts/package-windows-preview.mjs
      - name: Run the extracted Windows EXE and verify Classic, SQLite, isolation and relaunch
        id: verify
        shell: pwsh
        run: |
          $prefix = '${{ github.sha }}'.Substring(0, 12)
          $previews = @(Get-ChildItem "app/electron/bundle/HaruNeko-Enhanced-Preview-$prefix-win-x64-*.zip")
          if ($previews.Count -ne 1) { throw 'Expected exactly one portable preview ZIP from the checked-out commit' }
          $preview = $previews[0]
          node test/windows-preview-smoke.mjs --zip $preview.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Windows Preview smoke test failed' }
          "zip=$($preview.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$($preview.FullName).sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $digest = (Get-Content -LiteralPath "$($preview.FullName).sha256" -Raw).Trim().Split(' ')[0]
          $report = Get-Content app/electron/bundle/preview-smoke-win32.json -Raw | ConvertFrom-Json
          if ($report.packageSha256 -ne $digest) { throw 'Smoke report checksum differs from the tested ZIP' }
          "sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload the tested portable Preview, checksum and verification report
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaruNeko-Enhanced-Preview-Windows-x64-${{ github.sha }}-ZIP-${{ steps.verify.outputs.sha256 }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ steps.verify.outputs.zip }}
            ${{ steps.verify.outputs.checksum }}
            app/electron/bundle/preview-smoke-win32.json
      - name: Record exact source and tested package checksum
        shell: pwsh
        run: |
          $checksum = Get-Item -LiteralPath '${{ steps.verify.outputs.checksum }}'
          $report = Get-Content app/electron/bundle/preview-smoke-win32.json -Raw | ConvertFrom-Json
          if ($report.commit -ne '${{ github.sha }}' -or $report.archiveSchema -ne 11) { throw 'Preview source or schema mismatch' }
          "## Tested Windows Preview`n`nCommit: $($report.commit)`n`nSQLite schema: $($report.archiveSchema)`n`nEXE checks: $($report.checks.Count)`n`nArtifact: ${{ steps.artifact.outputs.artifact-url }}`n`nSHA-256: $(Get-Content $checksum.FullName -Raw)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
